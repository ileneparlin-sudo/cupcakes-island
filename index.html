const KEY='cupcake-island-v1';const defaults={stars:60,completed:[],owned:['pinkskirt','purplehoodie','pinkshoes'],hair:'pink',top:'purple',bottom:'pink',shoes:'pink',room:'cozy',placed:[],lastDay:''};let data;try{data={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data={...defaults}};const today=new Date().toLocaleDateString('en-CA');if(data.lastDay!==today){data.completed=[];data.lastDay=today}let page='island',toastTimer;data.placed=Array.isArray(data.placed)?data.placed:[];const save=()=>{localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('stars').textContent=data.stars};const navs=[['island','🏝️ Island'],['wardrobe','👗 Wardrobe'],['quests','⭐ Quests'],['rewards','🎁 Rewards'],['room','🏡 My Room']];const quests=[['morning','☀️','Morning Magic','Try your morning routine',15],['help','🧺','Helping Hands','Help with a chore',15],['reading','📚','Story Time','Read or listen to a book',15],['school','✏️','Brain Power','Practice or finish schoolwork',15],['bedtime','🌙','Dreamy Night','Try your bedtime routine',15]];const items=[['cathead','🐱','Cat-ear Headphones',40],['rainbow','🌈','Rainbow Hoodie',35],['starshoes','👟','Starry High-Tops',30],['fishbowl','🐠','Mini Aquarium',45],['beanbag','🩷','Heart Beanbag',25],['lamp','💡','Moon Lamp',25]];function notify(t){clearTimeout(toastTimer);document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=t;document.body.append(el);toastTimer=setTimeout(()=>el.remove(),2300)}function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}function render(){document.getElementById('nav').innerHTML=navs.map(([id,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('');document.getElementById('stars').textContent=data.stars;document.getElementById('main').innerHTML=({island:renderIsland,wardrobe:renderWardrobe,quests:renderQuests,rewards:renderRewards,room:renderRoom})[page]()}function renderIsland(){return `<h1 class="sectionTitle">Welcome to your island! 🌈</h1><p class="hint">Tap a place to explore. Your little adventures start here.</p><div class="island"><button class="place" style="top:34%;left:25%" onclick="go('room')"><span>🏡</span>My Cottage</button><button class="place" style="top:33%;left:73%" onclick="go('wardrobe')"><span>👗</span>Style Studio</button><button class="place" style="top:73%;left:27%" onclick="go('quests')"><span>🌸</span>Quest Garden</button><button class="place" style="top:73%;left:74%" onclick="go('rewards')"><span>🎁</span>Star Shop</button><div style="position:absolute;top:49%;left:45%;font-size:35px;pointer-events:none">🧁</div></div><div class="welcome"><div><strong>Hi, Maeve! 💖</strong><div class="hint" style="margin:5px 0 0">Your world is ready. Choose an adventure!</div></div><button class="cta" onclick="go('quests')">See Today's Quests ✨</button></div>`}

roke-linecap="round"/><path d="M83 148L137 148L156 217L64 217Z" fill="${hoodie}" stroke="#6c4b98" stroke-width="3"/><path d="M81 157L59 166L41 213L59 219L77 191M140 157L160 166L178 213L160 219L144 191" fill="${hoodie}" stroke="#6c4b98" stroke-width="3"/><path d="M99 151L108 170L118 151" fill="none" stroke="white" stroke-width="3"/><path d="M107 182L112 172L117 182L127 183L120 190L123 200L112 195L101 200L104 190L97 183Z" fill="#ffe282"/><path d="M68 215Q110 195 153 215L173 251Q112 271 48 251Z" fill="${skirt}" stroke="#c057a0" stroke-width="3"/><path d="M58 236Q111 249 163 236M56 250Q109 261 165 250" fill="none" stroke="#ffe5f6" stroke-width="4" stroke-dasharray="5 7"/><path d="M83 260L80 290M137 260L140 290" stroke="#f4b28f" stroke-width="16" stroke-linecap="round"/><path d="M68 283L97 283L102 309L63 309Q59 299 68 283ZM124 283L153 283L159 309L119 309Z" fill="${shoe}" stroke="#764c90" stroke-width="3"/><path d="M73 292L92 292M73 298L94 298M129 292L149 292M129 298L151 298" stroke="white" stroke-width="3"/><path d="M62 309H103M118 309H160" stroke="white" stroke-width="6"/><path d="M62 49L71 37L80 49L70 59Z" fill="#ff8ecf"/><path d="M146 47L154 36L162 48L153 58Z" fill="#ff8ecf"/></svg>`}
function choices(label,key,opts){return `<h3 style="margin:13px 0 7px">${label}</h3><div class="swatches">${opts.map(([v,n])=>`<button class="${data[key]===v?'selected':''}" onclick="change('${key}','${v}')">${n}</button>`).join('')}</div>`}function change(k,v){data[k]=v;save();render()}
function renderWardrobe(){return `<h1 class="sectionTitle">Maeve's Style Studio 💖</h1><p class="hint">Mix and match! Your look saves automatically.</p><div class="two"><div class="avatarStage">${avatar()}</div><div class="panel">${choices('Hair streaks','hair',[['pink','💗 Pink'],['purple','💜 Purple'],['brown','🤎 Natural']])}${choices('Hoodie','top',[['purple','💜 Lavender'],['pink','💗 Bubblegum'],['mint','🩵 Mint'],...(data.owned.includes('rainbow')?[['rainbow','🌈 Rainbow Hoodie ✓']]:[])] )}${choices('Tulle skirt','bottom',[['pink','💗 Pink'],['purple','💜 Lilac'],['blue','🩵 Sky']])}${choices('High-top sneakers','shoes',[['pink','💗 Pink'],['purple','💜 Purple'],['blue','🩵 Blue']])}<span class="badge">✨ Your outfit is saved!</span><p class="hint" style="margin-top:12px">Bought a new hoodie? It will appear in your hoodie choices above. <button class="cta" onclick="go('rewards')">Visit Star Shop 🎁</button></p></div></div>`}

function toggleRoomItem(id){if(!data.owned.includes(id))return;data.placed=data.placed.includes(id)?data.placed.filter(x=>x!==id):[...data.placed,id];save();render();notify(data.placed.includes(id)?'Decoration added to your room! 🏡':'Decoration put away 💗')}

 morning:{title:'☀️ Morning Adventure',sub:'One small step at a time.',steps:['Get dressed','Brush teeth','Eat breakfast','Pack school bag','Shoes and coat on']},

};

 data.support={...supportDefaults,done:old.done||{},day:old.day||'',hard:!!old.hard,keys:old.keys||0,reading:old.reading||0,dream:old.dream||0,allowance:old.allowance||0,week:old.week||'',cap:old.weeklyCap??5,pin:old.pin||'',chores:(old.chores||supportDefaults.chores).map(c=>Array.isArray(c)?c:[c.name,c.pay]),homework:[],savingsGoal:20};}

const weekKey=()=>{let d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};

function safeText(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function routineTile(id){let r=dailyDefs[id],n=routineCount(id);return `<div class="panel"><h3>${r.title}</h3><p class="hint">${r.sub}</p><div class="progress"><div style="width:${n/r.steps.length*100}%"></div></div><p class="hint">${n} / ${r.steps.length} steps celebrated</p><button class="cta" onclick="openRoutine('${id}')">Open adventure</button></div>`}
function renderDay(){return `<h1 class="sectionTitle">Today's Little Adventures ☀️</h1><p class="hint">A gentle plan for Maeve. Getting help still counts. Your stars never disappear on hard days.</p><div class="panel"><strong>💜 Gentle Day Mode: ${sup.hard?'On':'Off'}</strong><p class="hint">When today is tough, show just the essential steps.</p><button class="cta" onclick="toggleGentle()">${sup.hard?'Return to full routines':'Make today gentler'}</button></div><div class="two">${['morning','afternoon','learning','evening'].map(routineTile).join('')}</div><p class="hint">⭐ Routine steps earn 5 Island Stars each, once per day. No cash for ordinary routines.</p>`}

function renderRoutine(id){const r=dailyDefs[id];let visible=r.steps.map((name,i)=>({name,i}));if(sup.hard){let essentials={morning:[0,1,4],afternoon:[0,1],learning:[0,2],evening:[0,1,2,5]};visible=visible.filter(x=>essentials[id].includes(x.i))}
return `<h1 class="sectionTitle">${r.title}</h1><p class="hint">${r.sub}</p><button class="cta" onclick="go('${id==='learning'?'learning':'day'}')">← Back</button>${sup.hard?'<p class="softNotice">💜 Gentle Day: only a few steps. Asking for help is welcome.</p>':''}<div class="progress"><div style="width:${routineCount(id)/r.steps.length*100}%"></div></div>${visible.map(({name,i})=>{let done=sup.done[id+':'+i];return `<div class="quest ${done?'done':''}"><div class="emoji">${done?'🌟':'✨'}</div><div class="desc"><strong>${safeText(name)}</strong><small>${done?'You did it!':'+5 stars · independently or with help'}</small></div><button ${done?'disabled':''} onclick="completeStep('${id}',${i})">${done?'✓ Done':'I tried it!'}</button></div>`}).join('')}<div class="panel"><strong>🙋 Need help?</strong><p>Try saying: “Can you help me get started?”</p><button class="cta" onclick="notify('Asking for help is a brave step! 💜')">I need help 💜</button></div>`}
function completeStep(id,i){let key=id+':'+i;if(sup.done[key])return;sup.done[key]=true;data.stars+=5;if(id==='learning'&&i===0){sup.reading++;if(sup.reading%3===0)sup.keys++}if(id==='evening'&&i===5)sup.dream++;save();openRoutine(id);celebrate('Amazing effort! +5 Island Stars ⭐')}
function renderLearning(){return `<h1 class="sectionTitle">The Learning Tree 🌳📚</h1><p class="hint">Reading, math, and schoolwork. Trying and asking for help count!</p><div class="panel"><div style="font-size:45px">🌳📖🦋</div><strong>Reading adventures: ${sup.reading} · Magic Keys: ${sup.keys} 🔑</strong><p class="hint">Every three reading sessions earns a Magic Key.</p><button class="cta" onclick="openRoutine('learning')">Start a learning adventure</button></div><div class="panel"><h3>✏️ My Schoolwork</h3><p class="hint">Mama can add assignments in Mama Mode. Maeve can mark each one as tried or completed.</p>${sup.homework.length?sup.homework.map((h,i)=>`<div class="quest ${h.done?'done':''}"><div class="emoji">📘</div><div class="desc"><strong>${safeText(h.name)}</strong><small>${h.done?'Great work!':'One step at a time'}</small></div><button ${h.done?'disabled':''} onclick="finishHomework(${i})">${h.done?'✓ Done':'I worked on it!'}</button></div>`).join(''):'<p class="softNotice">No assignments added yet. You can still practice reading and math!</p>'}</div>`}

.mapHotspot:focus-visible{border:3px solid #fff;outline:3px solid #8132cb;background:#ffffff33}
.mapScroll:not(.is-zoomed) .mapHotspot{border:1px solid #ffffff55}
.mapZoomControls{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.mapZoomControls button{padding:11px 16px;border:2px solid #c583eb;background:#fff;color:#66359a;border-radius:14px;font-weight:800}
.mapZoomControls button[aria-pressed="true"]{background:#824ce1;color:white}

 .mapScroll{border-width:3px}
 .mapStage{min-width:0!important}
 .mapScroll.is-zoomed .mapStage{width:900px;min-width:900px!important}

}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

<script id="mobile-map-controls">
(function(){
  const oldRenderIsland=renderIsland;
  renderIsland=function(){
    let content=oldRenderIsland();
    const controls='<div class="mapZoomControls" role="group" aria-label="Island map view"><button type="button" aria-pressed="true" onclick="setIslandZoom(false)">🏝️ Whole island</button><button type="button" aria-pressed="false" onclick="setIslandZoom(true)">🔎 Explore close up</button></div>';
    content=content.replace('<div class="mapScroll"',controls+'<div class="mapScroll"');
    content=content.replace('On your phone, swipe across the map to explore.', 'See the whole island, or choose Explore close up to swipe around.');
    return content;
  };
  window.setIslandZoom=function(zoom){
    const scroller=document.querySelector('.mapScroll');
    if(!scroller)return;
    scroller.classList.toggle('is-zoomed',!!zoom);
    scroller.scrollLeft=0;
    document.querySelectorAll('.mapZoomControls button').forEach((button,i)=>button.setAttribute('aria-pressed',String(Boolean(i)===Boolean(zoom))));
  };
  const oldGo=go;
  go=function(next){oldGo(next);if(next==='island'){const m=document.querySelector('.mapScroll');if(m)m.scrollLeft=0;}};
  const build=document.getElementById('buildLabel');
  if(build)build.textContent='Cupcake Island v0.8 · Mobile map update 🌈';
  render();
})();
</script>
<script id="maeve-wardrobe-upgrade">
(function(){
  const previousRender=render;
  render=function(){
    const main=document.getElementById('main');
    main.onclick=null;
    previousRender();
    document.body.classList.toggle('wardrobe-open',page==='wardrobe');
    document.body.classList.toggle('cottage-open',page==='room');
    document.body.classList.toggle('lab-open',page==='lab');
    if(page==='wardrobe'){
      MaeveWardrobe.mount(main,data,save);
      const shop=document.createElement('button');
      shop.className='cta';shop.type='button';shop.textContent='Visit Star Shop 🎁';
      shop.onclick=()=>go('rewards');main.append(shop);
    }
  };
  render();
})();
</script>
